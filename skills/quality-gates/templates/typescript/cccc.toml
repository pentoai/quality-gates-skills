# Per-function cognitive and cyclomatic gate.
# cccc exits 1 when a function scores above either maximum.
# Declarations, generated files and installed agent skills are out; tests are in.
languages = ["es"]
exclude = [
	"**/*.d.ts",
	"**/_generated/**",
	"**/generated/**",
	".agents/**",
	".claude/**",
]
max-cognitive = 40
max-cyclomatic = 40
cache = true
