name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a superseded pull request run is cancelled; a run on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome on the TS scripts and JSON templates.
      - name: pnpm lint
        run: pnpm lint

      # tsc --noEmit on the scripts, with Node 24 types.
      - name: pnpm typecheck
        run: pnpm typecheck

      # Parse every JSON, YAML and TOML file under templates/ and .claude-plugin/.
      - name: pnpm test
        run: pnpm test

      # Checks this repo's workflows and both verify.yml templates (the templates sit in a
      # folder named `github`, so actionlint only sees them when they are passed by path).
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/ci.yml skills/quality-gates/templates/*/github/workflows/verify.yml
