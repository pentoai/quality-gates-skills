name: fixtures

# Applies the templates to the fixture repos and proves a bad commit is refused
# (scripts/test-fixtures.sh, SKILL.md step 5).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [typescript, python, mixed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The fixtures have no root package.json to read the pnpm version from.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.29.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: scripts/test-fixtures.sh ${{ matrix.fixture }}
